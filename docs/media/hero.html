<!doctype html>
<!--
  README 主图 hero.png 的源文件。重出：
  1. 每个 demo 导一帧到 docs/media/_frames/<短名>.png（时刻见下方 CARDS 的 t）：
     python3 skills/vividpaper/scripts/check.py examples/<短名>/<短名>.html --at <t>
     然后把 examples/<短名>/_frames/<短名>_t<t>.png 挪过来。
  2. Chrome 截图：--headless=new --window-size=1280,640 --force-device-scale-factor=2 --screenshot=docs/media/hero.png docs/media/hero.html
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#070709; --fg:#F4F3EF; --dim:#8A8A92; --line:#26262C; --acc:#FF6A2C; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1280px; height:640px; overflow:hidden; }
  body {
    background:
      radial-gradient(520px 300px at 640px 430px, rgba(255,106,44,.16), transparent 70%),
      var(--bg);
    color:var(--fg);
    font-family:-apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    position:relative;
  }
  .head { position:absolute; left:74px; right:74px; top:44px; }
  .brand { display:flex; align-items:center; gap:10px; font-size:17px; color:var(--dim); letter-spacing:.02em; }
  .brand i { width:9px; height:9px; border-radius:50%; background:var(--acc); }
  .brand b { color:var(--fg); font-weight:600; font-family:"SF Mono", Menlo, monospace; letter-spacing:0; }
  h1 { margin-top:12px; font-size:54px; line-height:1.1; font-weight:700; letter-spacing:-.01em; }
  h1 em { font-style:normal; color:var(--acc); }
  .sub { margin-top:16px; display:flex; align-items:center; gap:22px; }
  .pill { display:inline-block; font:500 17px "SF Mono", Menlo, monospace; color:var(--fg);
          border:1px solid var(--line); background:#101014; border-radius:999px; padding:9px 18px; }
  .pill span { color:var(--acc); }
  .feat { font-size:17px; color:var(--dim); }
  .row { position:absolute; left:0; right:0; bottom:40px; display:flex; justify-content:center; align-items:flex-end; gap:18px; }
  .card { display:flex; flex-direction:column; gap:10px; }
  .shot { border-radius:12px; overflow:hidden; border:1px solid var(--line); background:#000; box-shadow:0 18px 40px rgba(0,0,0,.55); }
  .shot img { display:block; width:100%; height:100%; object-fit:cover; }
  .card.main .shot { border:1.5px solid var(--acc); box-shadow:0 0 0 6px rgba(255,106,44,.10), 0 24px 60px rgba(0,0,0,.6); }
  .bar { position:relative; height:4px; border-radius:2px; background:var(--line); }
  .bar .fill { position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:var(--acc); }
  .bar .tick { position:absolute; top:-2px; width:1px; height:8px; background:#4a4a52; }
  .bar .dot { position:absolute; top:-4px; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:var(--acc); }
  .lab { display:flex; justify-content:space-between; gap:8px; white-space:nowrap; font-size:15px; color:var(--dim); }
  .lab b { color:var(--fg); font-weight:600; }
  .card.main .lab b { color:var(--acc); }
</style>
</head>
<body>
  <div class="head">
    <div class="brand"><i></i><b>VividPaper</b>· 张指导出品</div>
    <h1>视觉化读论文，<em>用动画</em></h1>
    <div class="sub">
      <div class="pill"><span>$</span> npx skills add ManagerZhang10/vividpaper</div>
      <div class="feat">论文原图 + 动效 · 一键配音 · 按章节跳 · 2× / 4× 倍速</div>
    </div>
  </div>
  <div class="row" id="row"></div>
<script>
const CARDS = [
  { n:'attention', d:'2:59', k:'Transformer', t:63.2, w:136, scenes:[16.4,35.7,55.6,82.5,101.2,116.9,141.8,159.9], total:179.0 },
  { n:'resnet', d:'3:37', k:'ResNet', t:73.5, w:150, scenes:[19.1,42.9,65.9,94.4,119.0,146.2,168.4,193.6], total:217.6 },
  { n:'rope', d:'3:58', k:'RoPE', t:56.5, w:166, scenes:[16.1,43.9,72.7,102.1,134.1,165.9,195.7,215.2], total:238.5 },
  { n:'vit', d:'3:40', k:'ViT', t:49.5, w:220, scenes:[15.9,41.9,66.3,91.3,115.6,142.7,173.9,196.4], total:220.8, main:true },
  { n:'ddpm', d:'3:31', k:'DDPM', t:31.9, w:166, scenes:[18.6,48.1,76.8,109.4,135.5,161.2,187.7], total:211.5 },
  { n:'flow-matching', d:'3:58', k:'Flow Matching', t:43.3, w:150, scenes:[17.7,45.1,71.6,101.6,132.8,166.1,190.8,216.2], total:238.5 },
  { n:'clip', d:'3:46', k:'CLIP', t:86.5, w:136, scenes:[16.9,39.3,56.5,78.9,103.9,129.2,153.1,175.7,203.1], total:226.6 },
];
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
document.getElementById('row').innerHTML = CARDS.map(c => {
  const p = c.t / c.total * 100;
  const ticks = c.scenes.map(s => `<i class="tick" style="left:${s / c.total * 100}%"></i>`).join('');
  return `<div class="card${c.main ? ' main' : ''}" style="width:${c.w}px">
    <div class="shot" style="height:${c.w * 4 / 3}px"><img src="_frames/${c.n}.png"></div>
    <div class="bar">${ticks}<i class="fill" style="width:${p}%"></i><i class="dot" style="left:${p}%"></i></div>
    <div class="lab"><b>${c.k}</b><span>${c.main ? mmss(c.t) + ' / ' : ''}${c.d}</span></div>
  </div>`;
}).join('');
</script>
</body>
</html>
